<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Nectar</title>
<!-- Favicon: a honey-amber honeycomb cell (self-contained SVG, no external file). -->
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cpath d='M16 2l12 7v14l-12 7-12-7V9z' fill='%23f5a623'/%3E%3Cpath d='M16 8l6.5 3.75v7.5L16 23l-6.5-3.75v-7.5z' fill='%23b9741a'/%3E%3C/svg%3E">
<!-- The mind-graph island (React Flow), built from graph-ui/ — self-contained, no CDN. -->
<link rel="stylesheet" href="/ui/assets/graph.css">
<style>
  :root {
    --bg: #14120e; --panel: #1e1b15; --panel2: #26221a; --line: #3a342a;
    --text: #ece5d8; --dim: #9a917f; --honey: #e8a723; --honey2: #f6c85f;
    --blue: #5aa9e6; --green: #6cc551; --teal: #3fc1c9; --purple: #b085f5;
    --orange: #f08a4b; --red: #e4572e; --gray: #8d99ae;
  }
  * { box-sizing: border-box; margin: 0; }
  body { background: var(--bg); color: var(--text); font: 14px/1.5 -apple-system, "Segoe UI", sans-serif; height: 100vh; height: 100dvh; display: flex; flex-direction: column; overflow: hidden; }
  header { display: flex; align-items: center; gap: 16px; padding: 10px 18px; background: var(--panel); border-bottom: 1px solid var(--line); }
  header h1 { font-size: 17px; color: var(--honey2); }
  header .tabs { display: flex; gap: 4px; }
  header .tabs button { background: none; border: 1px solid transparent; color: var(--dim); padding: 6px 14px; border-radius: 8px; cursor: pointer; font-size: 14px; }
  header .tabs button.active { background: var(--panel2); color: var(--text); border-color: var(--line); }
  header .spacer { flex: 1; }
  .badge { background: var(--honey); color: #201a08; border-radius: 10px; padding: 1px 8px; font-size: 12px; font-weight: 600; }
  .rolebadge { background: var(--panel2); border: 1px solid var(--line); color: var(--dim); border-radius: 10px; padding: 1px 8px; font-size: 12px; }
  main { flex: 1; display: flex; min-height: 0; min-width: 0; }
  .col { overflow-y: auto; }
  #left { width: 290px; background: var(--panel); border-right: 1px solid var(--line); padding: 12px; }
  #center { flex: 1; position: relative; }
  #right { width: 360px; background: var(--panel); border-left: 1px solid var(--line); padding: 14px; display: none; }
  #graphRoot { position: absolute; inset: 0; }
  input, select, textarea { width: 100%; background: var(--panel2); border: 1px solid var(--line); color: var(--text); border-radius: 8px; padding: 8px 10px; font-size: 14px; margin-bottom: 8px; }
  .check { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--dim); margin: 2px 0 10px; cursor: pointer; }
  .check input[type=checkbox] { width: auto; margin: 0; accent-color: var(--honey); }
  button.action { background: var(--honey); color: #201a08; border: none; border-radius: 8px; padding: 7px 14px; font-weight: 600; cursor: pointer; margin-right: 6px; transition: filter .12s, background .12s, color .12s, border-color .12s; }
  button.action:hover { filter: brightness(1.06); }
  button.ghost { background: none; border: 1px solid var(--line); color: var(--dim); border-radius: 8px; padding: 6px 12px; cursor: pointer; font-size: 13px; transition: background .12s, color .12s, border-color .12s; }
  button.ghost:hover { border-color: #6b6047; color: #ded6c4; }
  button.ghost.danger { border-color: var(--red); color: var(--red); }
  button.ghost.danger:hover { background: var(--red); color: #fff; }
  .btnrow { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 12px; }
  .btnrow button { margin: 0; }
  .item { padding: 8px 10px; border-radius: 8px; cursor: pointer; margin-bottom: 4px; }
  .item:hover { background: var(--panel2); }
  .item .t { font-size: 12px; color: var(--dim); }
  .section { margin-bottom: 16px; }
  .section h3 { font-size: 12px; text-transform: uppercase; letter-spacing: .08em; color: var(--dim); margin-bottom: 8px; }
  .chip { display: inline-block; background: var(--panel2); border: 1px solid var(--line); border-radius: 10px; padding: 1px 9px; font-size: 12px; margin: 0 4px 4px 0; cursor: pointer; }
  .card { background: var(--panel2); border: 1px solid var(--line); border-radius: 10px; padding: 12px; margin-bottom: 10px; }
  .card .meta { font-size: 12px; color: var(--dim); margin-bottom: 6px; }
  pre { background: #131109; border: 1px solid var(--line); border-radius: 8px; padding: 10px; font-size: 12px; overflow-x: auto; white-space: pre-wrap; margin: 6px 0; }
  /* Pollen decision cards — human-readable, no uids */
  .pcard { background: var(--panel2); border: 1px solid var(--line); border-radius: 10px; padding: 14px; margin-bottom: 12px; }
  .pcard.ready { border-color: var(--honey); }
  .phead { display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; margin-bottom: 2px; }
  .phead .ptitle { font-size: 15px; font-weight: 600; color: var(--text); }
  .pchip { font-size: 11px; color: var(--dim); background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 1px 7px; }
  .pchip.psim { color: var(--honey2); }
  .pexplain { font-size: 13px; color: var(--dim); margin: 6px 0 10px; }
  .pmems { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin: 8px 0; }
  .pmems.one { grid-template-columns: 1fr; }
  @media (max-width: 680px) { .pmems { grid-template-columns: 1fr; } }
  .mempanel { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 10px; min-width: 0; }
  .mempanel.new { border-color: var(--honey); }
  .mempanel.gone { opacity: .6; }
  .mlabel { font-size: 11px; text-transform: uppercase; letter-spacing: .06em; color: var(--dim); margin-bottom: 4px; }
  .mtitle { font-weight: 600; font-size: 13px; margin-bottom: 4px; word-break: break-word; }
  .mbody { font-size: 12.5px; color: var(--text); white-space: pre-wrap; word-break: break-word; max-height: 220px; overflow-y: auto; }
  .ptopic { display: inline-block; font-size: 12px; color: var(--honey2); margin-top: 4px; }
  /* ============ modern tab design-system (Focus/Pollen/Review/Governance/Beheer) ============ */
  .page { --gap: 16px; }
  .phdr { display: flex; align-items: flex-end; gap: 14px; flex-wrap: wrap; margin-bottom: 18px;
          padding-bottom: 14px; border-bottom: 1px solid var(--line); }
  .phdr .htxt { flex: 1; min-width: 200px; }
  .phdr h2 { font-size: 22px; letter-spacing: -.01em; color: var(--text); display: flex; align-items: center; gap: 9px; }
  .phdr h2 .ic { font-size: 20px; filter: saturate(1.1); }
  .phdr .sub { color: var(--dim); font-size: 13.5px; margin-top: 3px; }
  .phdr .hact { display: flex; gap: 8px; flex-wrap: wrap; }
  .stat { display: inline-flex; flex-direction: column; align-items: flex-start;
          background: var(--panel2); border: 1px solid var(--line); border-radius: 10px; padding: 7px 13px; }
  .stat b { font-size: 19px; color: var(--honey2); font-variant-numeric: tabular-nums; line-height: 1.1; }
  .stat span { font-size: 11px; color: var(--dim); text-transform: uppercase; letter-spacing: .05em; }
  /* stat-tile grid */
  .tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 12px; margin-bottom: var(--gap); }
  .tile { background: linear-gradient(160deg, var(--panel2), var(--panel)); border: 1px solid var(--line);
          border-radius: 14px; padding: 15px 16px; position: relative; overflow: hidden; }
  .tile::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 3px; background: var(--accent, var(--honey)); opacity: .9; }
  .tile .tnum { font-size: 27px; font-weight: 650; color: var(--text); font-variant-numeric: tabular-nums; line-height: 1; }
  .tile .tlbl { font-size: 12.5px; color: var(--dim); margin-top: 6px; }
  .tile .tsub { font-size: 11.5px; color: var(--dim); opacity: .8; margin-top: 2px; }
  /* content block (airier card) */
  .block { background: var(--panel2); border: 1px solid var(--line); border-radius: 14px; padding: 18px; margin-bottom: var(--gap); }
  .block > .bh { display: flex; align-items: center; gap: 9px; margin-bottom: 4px; }
  .block > .bh .ic { font-size: 17px; }
  .block > .bh h3 { font-size: 15px; color: var(--text); font-weight: 600; }
  .block > .bh .badge2 { margin-left: auto; }
  .block .bhint { color: var(--dim); font-size: 12.5px; margin-bottom: 14px; line-height: 1.5; }
  .badge2 { background: var(--panel); border: 1px solid var(--line); color: var(--dim);
            border-radius: 20px; padding: 2px 10px; font-size: 12px; font-variant-numeric: tabular-nums; }
  /* distribution bars */
  .dist { display: flex; flex-direction: column; gap: 9px; }
  .dist .row { display: grid; grid-template-columns: 120px 1fr 42px; align-items: center; gap: 10px; font-size: 13px; }
  .dist .row .k { color: var(--dim); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .dist .row .bar { height: 8px; border-radius: 5px; background: var(--panel); overflow: hidden; }
  .dist .row .bar > i { display: block; height: 100%; border-radius: 5px; background: var(--accent, var(--honey)); }
  .dist .row .v { text-align: right; font-variant-numeric: tabular-nums; color: var(--text); }
  /* action tiles (maintenance scans) */
  .acts { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 12px; }
  .act { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 14px;
         display: flex; flex-direction: column; gap: 8px; transition: border-color .12s, transform .12s; }
  .act:hover { border-color: #6b6047; }
  .act .ah { display: flex; align-items: center; gap: 8px; font-weight: 600; font-size: 13.5px; color: var(--text); }
  .act .ah .ic { font-size: 16px; }
  .act .ad { font-size: 12px; color: var(--dim); line-height: 1.45; flex: 1; }
  .act .arow { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .act .aout { font-size: 12px; color: var(--green); }
  /* segmented sub-nav */
  .subnav { display: flex; gap: 4px; background: var(--panel2); border: 1px solid var(--line);
            border-radius: 11px; padding: 4px; margin-bottom: 18px; flex-wrap: wrap; }
  .subnav button { flex: 1; min-width: 90px; background: none; border: none; color: var(--dim);
            padding: 8px 12px; border-radius: 8px; cursor: pointer; font-size: 13px; display: flex; align-items: center; justify-content: center; gap: 6px; }
  .subnav button.on { background: var(--panel); color: var(--honey2); box-shadow: inset 0 0 0 1px var(--line); }
  .subnav button:hover:not(.on) { color: var(--text); }
  /* progress bar */
  .prog { height: 7px; border-radius: 5px; background: var(--panel); overflow: hidden; }
  .prog > i { display: block; height: 100%; background: linear-gradient(90deg, var(--honey), var(--honey2)); border-radius: 5px; transition: width .3s; }
  /* focus step list (clickable) */
  .steps { display: flex; flex-direction: column; gap: 2px; margin: 10px 0; }
  .steps .step { display: flex; align-items: center; gap: 9px; padding: 6px 8px; border-radius: 8px; cursor: pointer; font-size: 13.5px; }
  .steps .step:hover { background: var(--panel); }
  .steps .step .box { width: 18px; height: 18px; border-radius: 5px; border: 1.5px solid var(--line);
            display: flex; align-items: center; justify-content: center; font-size: 12px; flex-shrink: 0; }
  .steps .step.done .box { background: var(--green); border-color: var(--green); color: #10240a; }
  .steps .step.current .box { border-color: var(--honey); color: var(--honey2); }
  .steps .step.done .txt { color: var(--dim); text-decoration: line-through; }
  .steps .step.current .txt { color: var(--text); font-weight: 550; }
  .steps .step .txt { color: var(--text); }
  /* guardrail chips */
  .guards { display: flex; flex-direction: column; gap: 6px; margin: 8px 0; }
  .guard { display: flex; gap: 8px; align-items: flex-start; font-size: 13px; color: #e6cfa0;
           background: rgba(232,167,35,.07); border: 1px solid rgba(232,167,35,.22); border-radius: 8px; padding: 7px 10px; }
  .guard .ic { flex-shrink: 0; }
  /* generic list rows */
  .lrow { display: flex; align-items: center; gap: 10px; padding: 10px 12px; border: 1px solid var(--line);
          border-radius: 10px; margin-bottom: 8px; background: var(--panel); }
  .lrow .grow { flex: 1; min-width: 0; }
  .lrow .grow .l1 { font-weight: 550; font-size: 13.5px; word-break: break-word; }
  .lrow .grow .l2 { font-size: 12px; color: var(--dim); margin-top: 2px; }
  .lrow .ra { display: flex; gap: 6px; align-items: center; flex-shrink: 0; }
  .pill { font-size: 11px; padding: 2px 9px; border-radius: 20px; border: 1px solid var(--line); color: var(--dim); white-space: nowrap; }
  .pill.role { color: var(--honey2); border-color: rgba(232,167,35,.4); }
  .pill.on { color: var(--green); border-color: rgba(108,197,81,.4); }
  .pill.off { color: var(--gray); }
  /* audit timeline */
  .tl { border-left: 2px solid var(--line); margin-left: 6px; padding-left: 16px; display: flex; flex-direction: column; gap: 14px; }
  .tl .ev { position: relative; }
  .tl .ev::before { content: ""; position: absolute; left: -22px; top: 4px; width: 9px; height: 9px; border-radius: 50%;
            background: var(--panel); border: 2px solid var(--honey); }
  .tl .ev .when { font-size: 11px; color: var(--dim); }
  .tl .ev .what { font-size: 13px; margin-top: 1px; }
  .tl .ev .what b { color: var(--honey2); font-weight: 600; }
  .tl .ev .det { font-size: 11.5px; color: var(--dim); margin-top: 2px; word-break: break-word; }
  .empty { text-align: center; color: var(--dim); padding: 36px 20px; border: 1px dashed var(--line); border-radius: 14px; font-size: 14px; }
  .empty .big { font-size: 30px; display: block; margin-bottom: 8px; opacity: .7; }
  .seg-hide { display: none; }
  label.fl { display: block; font-size: 12px; color: var(--dim); margin: 8px 0 3px; }
  /* settings rows with expandable what/how/risk */
  .setrow { padding: 13px 0; border-top: 1px solid var(--line); }
  .setrow:first-child { border-top: none; }
  .setline { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .setkey { font-weight: 600; font-size: 13.5px; flex: 1; min-width: 150px; display: flex; align-items: center; gap: 8px; }
  .setwhat { font-size: 12.5px; color: var(--dim); margin-top: 6px; line-height: 1.5; }
  .setdet { margin-top: 7px; }
  .setdet > summary { cursor: pointer; font-size: 12px; color: var(--honey2); width: max-content; list-style: none; user-select: none; }
  .setdet > summary::-webkit-details-marker { display: none; }
  .setdet > summary::before { content: "▸ "; }
  .setdet[open] > summary::before { content: "▾ "; }
  .sethow { font-size: 12.5px; color: var(--text); margin: 9px 0 0; line-height: 1.55; }
  .sethow code, .setkey code { background: var(--panel); border: 1px solid var(--line); border-radius: 5px; padding: 1px 5px; font-size: 11.5px; }
  .setrisk { font-size: 12.5px; color: #e6cfa0; background: rgba(232,167,35,.07); border: 1px solid rgba(232,167,35,.22);
             border-radius: 8px; padding: 8px 11px; margin-top: 9px; display: flex; gap: 8px; line-height: 1.5; }
  .pill.live { color: var(--green); border-color: rgba(108,197,81,.45); }
  .skillcode { font-family: monospace; font-size: 11.5px; opacity: .82; word-break: break-all; }
  .skillfiles { margin-top: 8px; display: flex; flex-direction: column; gap: 8px; }
  .skillfiles .fp { font-size: 12px; color: var(--honey2); font-family: monospace; margin-bottom: 3px; }
  @media (max-width: 820px) {
    .phdr h2 { font-size: 19px; }
    .dist .row { grid-template-columns: 92px 1fr 38px; }
    .tile .tnum { font-size: 23px; }
  }
  #overlay { position: fixed; inset: 0; background: var(--bg); display: flex; align-items: center; justify-content: center; z-index: 10; }
  #overlay .box { width: 340px; background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 24px; }
  #overlay h2 { color: var(--honey2); margin-bottom: 4px; }
  #overlay p { color: var(--dim); font-size: 13px; margin-bottom: 14px; }
  .page { flex: 1; overflow-y: auto; padding: 20px; max-width: 900px; min-width: 0; }
  .err { color: var(--red); font-size: 13px; margin-top: 6px; }
  .ok { color: var(--green); font-size: 13px; }
  .legend { position: absolute; bottom: 12px; left: 12px; background: rgba(30,27,21,.9); border: 1px solid var(--line); border-radius: 10px; padding: 8px 12px; font-size: 12px; color: var(--dim); }
  .legend span { display: inline-flex; align-items: center; gap: 4px; margin-right: 10px; }
  .dot { width: 9px; height: 9px; border-radius: 50%; display: inline-block; }
  .typefilter { display: flex; flex-wrap: wrap; gap: 6px; }
  .typechip { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; padding: 3px 10px;
              border: 1px solid var(--line); border-radius: 20px; cursor: pointer; user-select: none; color: #ded6c4; }
  .typechip.off { opacity: .38; }
  .typechip .dot { width: 9px; height: 9px; border-radius: 50%; }
  .typeall { flex-basis: 100%; font-size: 11px; color: var(--dim); margin-top: 4px; }
  .typeall a { color: var(--dim); }
  /* graph controls */
  .gtoolbar { position: absolute; top: 12px; left: 12px; display: flex; gap: 6px; z-index: 5; }
  .gtoolbar button { width: 34px; height: 34px; padding: 0; font-size: 16px; background: rgba(30,27,21,.92);
    border: 1px solid var(--line); color: #ded6c4; border-radius: 8px; cursor: pointer;
    display: flex; align-items: center; justify-content: center; }
  .gtoolbar button:hover { border-color: #6b6047; }
  .gtoolbar button.wide { width: auto; padding: 0 12px; gap: 6px; font-size: 13px; }
  .edgetab { position: absolute; top: 50%; transform: translateY(-50%); z-index: 5; width: 15px; height: 48px;
    background: rgba(30,27,21,.92); border: 1px solid var(--line); color: var(--dim); cursor: pointer;
    display: flex; align-items: center; justify-content: center; font-size: 11px; padding: 0; }
  .edgetab.left { left: 0; border-left: none; border-radius: 0 8px 8px 0; }
  .edgetab.right { right: 0; border-right: none; border-radius: 8px 0 0 8px; }
  .edgetab:hover { color: #ded6c4; border-color: #6b6047; }
  #left.collapsed, #right.collapsed { display: none; }
  #histDrawer { position: absolute; top: 0; right: 0; bottom: 0; width: 400px; max-width: 82%;
    background: var(--panel); border-left: 1px solid var(--line); z-index: 8; display: none; flex-direction: column; }
  #histDrawer.open { display: flex; }
  #histDrawer .hd { display: flex; align-items: center; justify-content: space-between; padding: 12px 14px; border-bottom: 1px solid var(--line); }
  #histDrawer .hd h3 { color: var(--honey2); font-size: 14px; }
  #histBody { overflow-y: auto; padding: 8px 14px; }
  .hevent { padding: 9px 0; border-bottom: 1px solid var(--line); font-size: 13px; }
  .hevent:last-child { border-bottom: none; }
  .hevent .when { color: var(--dim); font-size: 11px; margin-bottom: 2px; }
  .hevent .act { font-weight: 600; color: #ded6c4; }
  /* ---- mobile / small screens ---- */
  @media (max-width: 820px) {
    header { flex-wrap: wrap; gap: 8px; padding: 8px 12px; }
    header h1 { font-size: 16px; }
    header .tabs { order: 3; width: 100%; overflow-x: auto; -webkit-overflow-scrolling: touch; padding-bottom: 2px; }
    header .tabs button { padding: 6px 11px; white-space: nowrap; }
    header .spacer { display: none; }
    header > button.ghost { padding: 6px 10px; font-size: 12px; }
    /* side panels become full-height slide-in overlays instead of eating width */
    #left, #right { position: absolute; top: 0; bottom: 0; z-index: 14; box-shadow: 0 0 40px rgba(0,0,0,.55); }
    #left { left: 0; width: 86%; max-width: 330px; }
    #right { right: 0; width: 92%; max-width: 400px; }
    .gtoolbar { top: 8px; left: 8px; gap: 5px; }
    .gtoolbar button { width: 40px; height: 40px; font-size: 17px; }   /* bigger tap targets */
    .gtoolbar button.wide { width: auto; padding: 0 12px; }
    .edgetab { width: 22px; height: 62px; font-size: 14px; z-index: 16; }  /* stay tappable over the panels to close them */
    .legend { font-size: 11px; max-width: 60%; }
    .page { padding: 14px; max-width: none; }
    input, select, textarea, button { font-size: 16px; }   /* ≥16px stops iOS zoom-on-focus */
    #histDrawer { width: 92%; }
  }
  /* elements that only exist in the standalone mobile layout — hidden on desktop */
  .show-mobile { display: none; }
  #mobilenav { display: none; }
  #acctMenu { display: none; }
  /* ===================== standalone mobile design (bottom-nav app shell) ===================== */
  @media (max-width: 820px) {
    header { flex-wrap: nowrap; padding: 9px 14px; gap: 10px; align-items: center; }
    header h1 { font-size: 17px; flex: 0 0 auto; }
    header .tabs { display: none; }            /* replaced by the bottom tab bar */
    .hide-mobile { display: none; }
    .show-mobile { display: inline-flex; }
    #who { font-size: 11px; max-width: 40vw; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    #acctBtn { background: var(--panel2); border: 1px solid var(--line); color: var(--text);
      width: 38px; height: 38px; border-radius: 10px; font-size: 20px; line-height: 1; padding: 0;
      align-items: center; justify-content: center; cursor: pointer; }
    #acctMenu { position: fixed; top: 56px; right: 12px; z-index: 30; background: var(--panel);
      border: 1px solid var(--line); border-radius: 12px; padding: 6px; flex-direction: column; gap: 2px;
      box-shadow: 0 12px 34px rgba(0,0,0,.55); min-width: 210px; }
    #acctMenu.open { display: flex; }
    #acctMenu button { background: none; border: none; color: var(--text); text-align: left;
      padding: 12px 12px; border-radius: 8px; font-size: 15px; cursor: pointer; }
    #acctMenu button:active { background: var(--panel2); }
    /* bottom tab bar — a real flex row so it never overlaps content */
    #mobilenav { display: flex; flex: 0 0 auto; background: var(--panel); border-top: 1px solid var(--line);
      padding: 4px 2px calc(4px + env(safe-area-inset-bottom)); z-index: 20; }
    #mobilenav button { flex: 1; background: none; border: none; color: var(--dim); cursor: pointer;
      display: flex; flex-direction: column; align-items: center; gap: 3px; padding: 6px 0 4px;
      font-size: 10.5px; position: relative; border-radius: 8px; min-width: 0; }
    #mobilenav button .mi { font-size: 21px; line-height: 1; filter: grayscale(.45); opacity: .78; transition: opacity .12s; }
    #mobilenav button.active { color: var(--honey2); }
    #mobilenav button.active .mi { filter: none; opacity: 1; }
    #mobilenav .ml { max-width: 100%; overflow: hidden; text-overflow: ellipsis; }
    .mdot { display: none; position: absolute; top: 3px; left: 50%; margin-left: 6px; width: 8px; height: 8px;
      border-radius: 50%; background: var(--honey); border: 1.5px solid var(--panel); }
    /* content: single column, comfortable, room above the bottom bar */
    html, body { max-width: 100%; overflow-x: hidden; }
    .page { padding: 16px 14px 26px; max-width: none; overflow-x: hidden; }
    .phdr { align-items: flex-start; }
    .phdr .hact { width: 100%; }
    /* CSS grids: minmax(0,1fr) so tracks shrink below their content instead of overflowing */
    .tiles { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
    .acts { grid-template-columns: minmax(0, 1fr); }
    .pmems { grid-template-columns: minmax(0, 1fr); }
    .tile, .lrow, .grow, .mempanel, .block, .stat { min-width: 0; max-width: 100%; }
    /* any inline auto-fit multi-column grid collapses to one column on phones */
    main .page div[style*="grid-template-columns"] { grid-template-columns: minmax(0, 1fr) !important; }
    .dist .row { grid-template-columns: 84px minmax(0, 1fr) 30px; }
    .subnav { overflow-x: auto; flex-wrap: nowrap; -webkit-overflow-scrolling: touch; }
    .subnav button { flex: 0 0 auto; min-width: auto; padding: 9px 13px; }
    .lrow { flex-wrap: wrap; }
    .lrow .ra { width: 100%; }
    .btnrow button, .act button, .action, button.ghost { min-height: 42px; }
    /* Mind graph sits in the space above the bar; keep legend/toolbar clear of it */
    .legend { max-width: 68%; font-size: 10px; bottom: 10px; }
    #histDrawer { width: 100%; max-width: 100%; }
  }
  .hevent .tgt { color: var(--dim); word-break: break-word; }
  .hevent a.tgt { color: var(--honey2); cursor: pointer; text-decoration: none; }
  .hevent a.tgt:hover { text-decoration: underline; }
  /* searchable name-picker (never expose uids in the UI) */
  .picker { border: 1px solid var(--line); border-radius: 8px; margin-top: 4px; max-height: 200px;
    overflow-y: auto; background: var(--panel2); display: none; }
  .picker.open { display: block; }
  .pickitem { padding: 6px 10px; cursor: pointer; font-size: 13px; display: flex; align-items: center; gap: 6px; }
  .pickitem:hover { background: var(--panel); }
  .picked { font-size: 12px; color: var(--green); margin-top: 4px; }
  /* sci-fi graph theme (toggle) — only the canvas changes, so it reverts instantly */
  #center { transition: background .5s ease; }
  #center.scifi { background:
     radial-gradient(ellipse 60% 55% at 50% 46%, #0d3358 0%, #08203a 42%, #030c18 78%, #01060d 100%); }
  #center.scifi .legend { background: rgba(6,20,36,.82); border-color: #17466b; color: #9fc7e6; }
  #center.scifi .gtoolbar button, #center.scifi .edgetab {
     background: rgba(6,22,40,.9); border-color: #17466b; color: #bfe8ff; }
  #center.scifi .gtoolbar button:hover, #center.scifi .edgetab:hover { border-color: #3fb0ff; color: #eaffff; }
</style>
</head>

<script src="/ui/assets/graph.js"></script>
<script>
const COLORS = { topic:"#e8a723", memory:"#5aa9e6", process:"#6cc551", workflow:"#3fc1c9",
                 skill:"#b085f5", convention:"#f08a4b", decision:"#e4572e", glossary:"#8d99ae",
                 learning:"#f15bb5" };
const HIVE_UID = "__hive__";       // synthetic central node all top-level topics hang off
const HIVE_COLOR = "#f6c85f";
let TOPICS = [];                   // topic titles, for the move-to-topic select
let PROJECTS = [];                 // top-level topics {uid,title}, for the project filter
// Multiselect type filter: every type is visible until unchecked. Drives both the graph and search.
const activeTypes = new Set(Object.keys(COLORS));
const typeVisible = t => t === "hive" || t === "attachment" || activeTypes.has(t);
const ATT_COLOR = "#c9b98f";

function renderTypeFilter() {
  document.getElementById("typeFilter").innerHTML = Object.keys(COLORS).map(t =>
    `<span class="typechip ${activeTypes.has(t) ? "on" : "off"}" onclick="toggleType('${t}')">
       <span class="dot" style="background:${COLORS[t]}"></span>${t}</span>`).join("") +
    `<div class="typeall"><a href="#" onclick="setAllTypes(true);return false">alles</a> ·
     <a href="#" onclick="setAllTypes(false);return false">niets</a></div>`;
}
function toggleType(t) {
  activeTypes.has(t) ? activeTypes.delete(t) : activeTypes.add(t);
  renderTypeFilter(); NectarGraph.setTypeFilter([...activeTypes]); doSearch();
}
function setAllTypes(on) {
  Object.keys(COLORS).forEach(t => on ? activeTypes.add(t) : activeTypes.delete(t));
  renderTypeFilter(); NectarGraph.setTypeFilter([...activeTypes]); doSearch();
}
let TOKEN = localStorage.getItem("hive_token") || "";
let ME = null;

// iOS Safari's bottom toolbar overlaps a `100vh` layout, hiding the bottom nav. Modern browsers
// use `100dvh` (CSS above). For older iOS that lacks dvh, pin body height to the real visible
// height so the bottom bar always sits above Safari's chrome.
(function () {
  if (window.CSS && CSS.supports && CSS.supports("height", "100dvh")) return;
  const fit = () => { document.body.style.height = window.innerHeight + "px"; };
  window.addEventListener("resize", fit);
  window.addEventListener("orientationchange", fit);
  fit();
})();

const esc = s => (s ?? "").toString().replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

async function api(path, opts = {}) {
  const r = await fetch(path, { ...opts, headers: {
    "Authorization": "Bearer " + TOKEN, "Content-Type": "application/json", ...(opts.headers || {}) }});
  if (r.status === 401) { logout(); throw new Error("unauthorized"); }
  if (!r.ok) throw new Error((await r.json().catch(() => ({}))).detail || r.statusText);
  return r.json();
}

function loginTab(which) {
  document.getElementById("loginPw").style.display = which === "pw" ? "" : "none";
  document.getElementById("loginTok").style.display = which === "tok" ? "" : "none";
  document.getElementById("tabPw").classList.toggle("action", which === "pw");
  document.getElementById("tabTok").classList.toggle("action", which === "tok");
}

async function loginPassword() {
  const name = document.getElementById("luser").value.trim();
  const password = document.getElementById("lpass").value;
  try {
    const r = await fetch("/auth/login", { method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ name, password }) });
    if (!r.ok) throw new Error("mis");
    TOKEN = (await r.json()).token;
    ME = await api("/graph/me");
    localStorage.setItem("hive_token", TOKEN);
    document.getElementById("overlay").style.display = "none";
    boot();
  } catch (e) { document.getElementById("loginErr").textContent = "Ongeldige gebruikersnaam of wachtwoord"; }
}

async function login() {
  TOKEN = document.getElementById("tokenInput").value.trim();
  try {
    ME = await api("/graph/me");
    localStorage.setItem("hive_token", TOKEN);
    document.getElementById("overlay").style.display = "none";
    boot();
  } catch (e) { document.getElementById("loginErr").textContent = "Token niet geldig"; }
}
function logout() { localStorage.removeItem("hive_token"); location.reload(); }

async function setMyPassword() {
  const pw = prompt("Nieuw wachtwoord (min. 8 tekens) voor '" + ME.name + "':");
  if (!pw) return;
  try {
    await api("/auth/password", { method: "POST", body: JSON.stringify({ password: pw }) });
    alert("Wachtwoord ingesteld. Je kunt nu inloggen met gebruikersnaam '" + ME.name + "' + wachtwoord.");
  } catch (e) { alert(e.message); }
}

function showTab(name) {
  for (const m of document.querySelectorAll("main")) m.style.display = "none";
  document.getElementById("tab-" + name).style.display = "flex";
  for (const b of document.querySelectorAll(".tabs button, #mobilenav button")) b.classList.toggle("active", b.dataset.tab === name);
  closeAcctMenu();
  if (name === "focus") loadFocus();
  if (name === "chores") loadChores();
  if (name === "review") loadReview();
  if (name === "governance") loadGovernance();
  if (name === "beheer") renderBeheer();
}

function toggleAcctMenu(e) { if (e) e.stopPropagation(); document.getElementById("acctMenu").classList.toggle("open"); }
function closeAcctMenu() { const m = document.getElementById("acctMenu"); if (m) m.classList.remove("open"); }
document.addEventListener("click", e => {
  const m = document.getElementById("acctMenu");
  if (m && m.classList.contains("open") && !m.contains(e.target) && e.target.id !== "acctBtn") closeAcctMenu();
});

/* ---------- mind graph (React Flow island — bron: graph-ui/, bundle: /ui/assets/graph.js) ---------- */
let sciFi = localStorage.getItem("hive_scifi") !== "off";   // sci-fi graph theme (default on, toggleable)

/* ---------- theme + zoom & panel controls ---------- */
function applySciFi() {
  const c = document.getElementById("center"); if (c) c.classList.toggle("scifi", sciFi);
  const b = document.getElementById("sciBtn"); if (b) b.style.color = sciFi ? "#4fd6ff" : "";
  NectarGraph.setSciFi(sciFi);
}
function toggleSciFi() {
  sciFi = !sciFi;
  localStorage.setItem("hive_scifi", sciFi ? "on" : "off");
  applySciFi();
}
function zoomBy(f) { f < 1 ? NectarGraph.zoomIn() : NectarGraph.zoomOut(); }
function fitView() { NectarGraph.fit(); }
function toggleLeft() {
  const el = document.getElementById("left");
  const hidden = el.classList.toggle("collapsed");
  document.getElementById("leftTab").textContent = hidden ? "›" : "‹";
}
function toggleRight() {
  const el = document.getElementById("right");
  const show = el.style.display === "none" || !el.style.display;
  if (show && !NectarGraph.getSelected()) el.innerHTML = `<div class="section" style="color:var(--dim)">Selecteer een knoop om details te zien.</div>`;
  el.style.display = show ? "block" : "none";
  document.getElementById("rightTab").textContent = show ? "›" : "‹";
}

/* ---------- history log (audit trail) ---------- */
const HIST_LABELS = { remember:"onthouden", create_topic:"topic aangemaakt", move_node:"verplaatst",
  merge_topics:"topics samengevoegd", delete:"verwijderd", suggest:"wijziging voorgesteld",
  resolve_chore:"chore afgehandeld", admin_resolve_chore:"chore afgehandeld (admin)",
  attach:"bijlage toegevoegd", attach_delete:"bijlage verwijderd", set_system:"systeemvlag gezet",
  set_role:"rol gewijzigd", invite_create:"uitnodiging aangemaakt", login:"ingelogd",
  login_entra:"ingelogd (Microsoft)", login_entra_provision:"account aangemaakt (Microsoft)",
  password_set:"wachtwoord ingesteld", password_set_for:"wachtwoord ingesteld voor",
  secret_set:"secret opgeslagen", secret_get:"secret gelezen", secret_read:"secret gelezen",
  skill_create:"skill aangemaakt",
  skill_update:"skill bijgewerkt", workflow_create:"workflow aangemaakt", workflow_update:"workflow bijgewerkt",
  approve_scope_widening:"scope-verbreding goedgekeurd", supersede:"vervangen (superseded)",
  resolve_contradiction:"tegenspraak afgehandeld", resolve_think:"denk-Pollen afgehandeld",
  lifecycle:"levensfase gewijzigd", set_importance:"belang aangepast", set_decay:"verval aangepast",
  reclassify_sensitivity:"gevoeligheid herbeoordeeld", pagerank_scan:"PageRank herberekend",
  contradiction_scan:"tegenspraak-scan", linkpred_scan:"link-predictie", tidy_scan:"opruim-scan",
  staleness_scan:"staleness-scan", relate:"gekoppeld", unlink:"koppeling verwijderd",
  reembed:"opnieuw ge-embed", train_ranker:"ranker getraind", feedback:"feedback gegeven",
  invite_revoke:"uitnodiging ingetrokken", token_rotate:"token geroteerd", token_revoke:"token ingetrokken",
  create_account:"account aangemaakt", create_token:"token aangemaakt", set_consensus:"consensus-drempel gewijzigd" };
function histLabel(a) { return HIST_LABELS[a] || (a || "").replace(/_/g, " "); }
function timeAgo(ms) {
  if (!ms) return "";
  const s = Math.floor((Date.now() - ms) / 1000);
  if (s < 60) return "zojuist";
  const m = Math.floor(s/60); if (m < 60) return m + " min geleden";
  const h = Math.floor(m/60); if (h < 24) return h + " uur geleden";
  const d = Math.floor(h/24); if (d < 7) return d + (d > 1 ? " dagen" : " dag") + " geleden";
  return new Date(ms).toLocaleDateString("nl-NL");
}
async function openHistory() {
  document.getElementById("histDrawer").classList.add("open");
  const body = document.getElementById("histBody");
  body.innerHTML = `<div class="t" style="color:var(--dim)">laden…</div>`;
  try {
    const ev = await api("/graph/audit?limit=200");
    body.innerHTML = ev.length ? ev.map(e => {
      let detail = {}; try { detail = JSON.parse(e.detail || "{}"); } catch (_) {}
      const isGuid = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-/i.test(e.target || "");
      // prefer the live node title, then the title captured in the event, then the raw target
      const name = e.target_title || detail.title || (isGuid ? "(verwijderd)" : (e.target || ""));
      const shown = name.length > 58 ? name.slice(0,57) + "…" : name;
      const tgt = e.target_title   // still exists → clickable, jumps to it in the graph
        ? `<a href="#" class="tgt" onclick='histJump("${e.target}");return false'>${esc(shown)}</a>`
        : `<span class="tgt">${esc(shown)}</span>`;
      return `<div class="hevent"><div class="when">${timeAgo(e.at)} · ${esc(e.account || "systeem")}</div>
        <div><span class="act">${esc(histLabel(e.action))}</span> ${tgt}</div></div>`;
    }).join("") : `<div class="t" style="color:var(--dim)">nog geen gebeurtenissen</div>`;
  } catch (err) {
    body.innerHTML = `<div class="t" style="color:var(--red)">${esc(err.message)}</div>`
      + (ME.role !== "org_admin" ? `<div class="t" style="color:var(--dim);margin-top:6px">De historie is voorbehouden aan org_admins.</div>` : "");
  }
}
function closeHistory() { document.getElementById("histDrawer").classList.remove("open"); }
async function histJump(uid) { closeHistory(); try { await jumpTo(uid); } catch (_) {} }

/* Thin wrappers around the graph island; the rest of the page keeps calling these. */
async function expandNode(uid) { await NectarGraph.expand(uid); }
async function selectNode(uid) { await NectarGraph.select(uid); }

/* Renders the right-hand detail panel for a node (the island calls this on select). */
async function renderNodePanel(uid) {
  const n = await api("/graph/node/" + uid);
  const right = document.getElementById("right");
  right.style.display = "block";
  const chips = (arr, label) => arr && arr.length
    ? `<div class="section"><h3>${label}</h3>${arr.map(x =>
        `<span class="chip" onclick="jumpTo('${x.uid}')">${esc(x.title)}</span>`).join("")}</div>` : "";
  right.innerHTML = `
    <div class="section"><h3>${esc(n.type)} · scope ${esc(n.scope)}</h3>
      <strong style="font-size:16px">${esc(n.title)}</strong></div>
    ${n.content ? `<pre>${esc(n.content)}</pre>` : ""}
    ${n.type === "topic" && n.summary ? `<div class="section"><h3>Samenvatting</h3><div class="t" style="color:var(--dim)">${esc(n.summary)}</div></div>` : ""}
    ${n.type !== "topic" ? `<div class="section"><h3>Status (Bloom)</h3>
      <div>${bloomBadge(n.lifecycle)}
        ${(n.pos || n.neg) ? `<span class="t" style="color:var(--dim);margin-left:6px">👍 ${n.pos||0} · 👎 ${n.neg||0} (waarde)</span>` : ""}
        ${n.superseded_by ? `<a href="#" class="chip" style="border-color:var(--red);color:var(--red)" onclick='jumpTo("${n.superseded_by}");return false'>⤳ vervangen — toon nieuwste</a>` : ""}</div>

// Reusable searchable name-picker: type a name, pick from live search results. Never a uid.
const PICK = {};            // pickId -> {uid, title}
const PICK_RESULTS = {};    // pickId -> last search results
async function searchPicker(q, pickId, inputId) {
  const box = document.getElementById(pickId);
  PICK[pickId] = null;
  const done = document.getElementById(pickId + "_sel"); if (done) done.textContent = "";
  if (!q || q.trim().length < 2) { box.classList.remove("open"); box.innerHTML = ""; return; }
  try {
    const rs = (await api("/graph/search?q=" + encodeURIComponent(q))).slice(0, 8);
    PICK_RESULTS[pickId] = rs;
    box.innerHTML = rs.length ? rs.map((r, i) =>
      `<div class="pickitem" onclick="pickNode('${pickId}','${inputId}',${i})">
         <span class="dot" style="background:${COLORS[r.type] || '#8d99ae'}"></span>
         ${esc(r.title)} <span class="t" style="color:var(--dim)">· ${esc(r.type)}</span></div>`).join("")
      : `<div class="pickitem" style="color:var(--dim)">niets gevonden</div>`;
    box.classList.add("open");
  } catch (e) {}
}
function pickNode(pickId, inputId, i) {
  const r = PICK_RESULTS[pickId][i];
  PICK[pickId] = { uid: r.uid, title: r.title };
  document.getElementById(inputId).value = r.title;
  const box = document.getElementById(pickId); box.classList.remove("open"); box.innerHTML = "";
  const done = document.getElementById(pickId + "_sel"); if (done) done.textContent = "✓ gekozen: " + r.title;
}

async function downloadAttachment(attUid, filename) {
  const r = await fetch(`/attachments/${attUid}`, { headers: { "Authorization": "Bearer " + TOKEN } });
  if (!r.ok) { alert("download mislukt"); return; }
  const a = document.createElement("a");
  a.href = URL.createObjectURL(await r.blob()); a.download = filename || "bijlage"; a.click();
  URL.revokeObjectURL(a.href);
}
// Preview an attachment in the panel (text/image), with an explicit Download button —
// clicking an attachment node does NOT auto-download.
async function showAttachment(attUid, filename) {
  const right = document.getElementById("right");
  right.style.display = "block";
  right.innerHTML = `<div class="section"><h3>📎 Bijlage</h3><strong>${esc(filename)}</strong>
    <div class="t" id="attMeta" style="color:var(--dim);margin-top:6px">laden…</div></div>`;
  try {
    const r = await fetch(`/attachments/${attUid}`, { headers: { "Authorization": "Bearer " + TOKEN } });
    if (!r.ok) throw new Error("kon bijlage niet laden");
    const ct = (r.headers.get("content-type") || "").toLowerCase();
    const blob = await r.blob();
    const url = URL.createObjectURL(blob);
    const textish = ct.startsWith("text/") || /json|sql|xml|csv|javascript|x-python|yaml|markdown|x-sh|plain/.test(ct)
      || /\.(txt|md|json|sql|xml|csv|ya?ml|py|js|ts|sh|log|conf|ini|ipynb)$/i.test(filename);
    let preview;
    if (ct.startsWith("image/")) preview = `<img src="${url}" style="max-width:100%;border-radius:8px">`;
    else if (textish) {
      const text = await blob.text();
      preview = `<pre style="max-height:60vh;overflow:auto">${esc(text.slice(0, 20000))}${text.length > 20000 ? "\n… (afgekapt, download voor het geheel)" : ""}</pre>`;
    } else preview = `<div class="t" style="color:var(--dim)">Binair bestand — geen preview. Gebruik Download.</div>`;
    right.innerHTML = `<div class="section"><h3>📎 Bijlage</h3><strong>${esc(filename)}</strong>
      <div class="t" style="color:var(--dim);margin:4px 0 10px">${esc(ct || "onbekend type")} · ${(blob.size/1024).toFixed(1)} kB</div>
      <button class="action" id="attDl">Download</button></div>
      <div class="section">${preview}</div>`;
    document.getElementById("attDl").onclick = () => {
      const a = document.createElement("a"); a.href = url; a.download = filename || "bijlage"; a.click();
    };
  } catch (e) {
    const m = document.getElementById("attMeta"); if (m) m.textContent = e.message;
  }
}

let TOPIC_DATA = { topics: [], edges: [] };
async function loadTopics() {
  const data = await api("/graph/topics");
  TOPIC_DATA = data;
  TOPICS = data.topics.map(t => t.title).sort((a, b) => a.localeCompare(b, "nl"));
  // Projects = top-level topics (no parent topic) — used for the project filter.
  const hasParent = new Set(data.edges.map(e => e.child));
  PROJECTS = data.topics.filter(t => !hasParent.has(t.uid)).sort((a, b) => a.title.localeCompare(b.title, "nl"));
  renderProjectFilter();
  // One central Nectar hub. Default view = ONLY the top-level topics hang off it;
  // sub-topics and member nodes stay hidden until you click a topic to expand it.
  NectarGraph.setRoot(data.topics.filter(t => !hasParent.has(t.uid))
    .map(t => ({ uid: t.uid, title: t.title })));
  document.getElementById("topicList").innerHTML = data.topics.map(t =>
    `<div class="item" onclick="jumpTo('${t.uid}')">${esc(t.title)} <span class="t">${t.children} items</span></div>`).join("")
    || `<div class="t" style="color:var(--dim)">Nog geen topics — de eerste hive_remember maakt ze.</div>`;
}
function renderProjectFilter() {
  const sel = document.getElementById("projectFilter"); if (!sel) return;
  const cur = sel.value;
  sel.innerHTML = `<option value="">— alle projecten —</option>` +
    PROJECTS.map(p => `<option value="${p.uid}">${esc(p.title)}</option>`).join("");
  sel.value = cur;
}
// Focus the graph on one project (a top-level topic + its subtree), or reset to the full hub.
async function selectProject(uid) {
  document.getElementById("right").style.display = "none";
  if (!uid) { await loadTopics(); return; }
  const p = PROJECTS.find(x => x.uid === uid);
  await NectarGraph.setProject(uid, p ? p.title : "project");
}

const TYPE_COLORS = COLORS;
function distBars(obj, colorFn) {
  const entries = Object.entries(obj || {}).sort((a, b) => b[1] - a[1]);
  if (!entries.length) return `<div class="t" style="color:var(--dim)">geen data</div>`;
  const max = Math.max(...entries.map(e => e[1])) || 1;
  return `<div class="dist">` + entries.map(([k, v]) => {
    const col = colorFn ? colorFn(k) : "var(--honey)";
    return `<div class="row"><span class="k" title="${esc(k)}">${esc(k)}</span>
      <span class="bar"><i style="width:${Math.round(v / max * 100)}%;background:${col}"></i></span>
      <span class="v">${v}</span></div>`;
  }).join("") + `</div>`;
}

/* Render one audit event human-readably: action + who (person/account name), the subject as a
   real title (never a uid), and any remaining detail with uid-like values filtered out. */
function isUidLike(v) {
  return typeof v === "string" && (/^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}/i.test(v) || /^[0-9a-f]{16,}$/i.test(v));
}
function auditDetailText(str, usedTitle) {
  let d; try { d = JSON.parse(str || "{}"); } catch (e) { return isUidLike(str) ? "" : esc(str || ""); }
  if (!d || typeof d !== "object") return esc(String(d));
  const parts = Object.entries(d)
    .filter(([k, v]) => v != null && v !== "" && typeof v !== "object" && !isUidLike(v) && String(v) !== usedTitle)
    .map(([k, v]) => `${esc(k.replace(/_/g, " "))}: ${esc(String(v))}`);
  return parts.join(" · ");
}
function auditEvent(e) {
  const fmt = ms => new Date(ms).toLocaleString("nl-NL");
  let d = {}; try { d = JSON.parse(e.detail || "{}"); } catch (_) {}
  const subjectTitle = e.target_title || d.title || d.name || d.result || "";
  const subject = e.target_title
    ? `${e.target_type ? `<span class="pill" style="margin-right:6px">${esc(e.target_type)}</span>` : ""}${esc(e.target_title)}`
    : (subjectTitle ? esc(subjectTitle) : "");
  const det = auditDetailText(e.detail, subjectTitle);
  return `<div class="ev">
    <div class="when">${fmt(e.at)}</div>
    <div class="what"><b>${esc(histLabel(e.action))}</b> · ${esc(e.account || "systeem")}</div>
    ${subject ? `<div class="det">${subject}</div>` : ""}
    ${det ? `<div class="det" style="opacity:.8">${det}</div>` : ""}
  </div>`;
}

/* ---------- Pollen ---------- */
function pMem(m, cls) {
  if (!m || (!m.title && !m.content)) return "";
  return `<div class="mempanel ${cls || ""}">
    ${m.label ? `<div class="mlabel">${esc(m.label)}</div>` : ""}
    <div class="mtitle">${esc(m.title || "(zonder titel)")}</div>
    ${m.content ? `<div class="mbody">${esc(m.content)}</div>` : ""}</div>`;
}
function pBody(v, type) {
  if (v.route === "contradiction")
    return `<div class="pmems">${pMem(v.primary)}${pMem(v.compare)}</div>`;
  if (v.route === "op_route")
    return `<div class="pmems">${pMem(v.primary, "new")}${pMem(v.compare)}</div>`;
  if (v.proposed)   // edit: before → after
    return `<div class="pmems">${pMem({ ...v.primary, label: "Nu" })}${pMem({ ...v.proposed, label: "Voorgesteld" }, "new")}</div>`;
  if (v.compare)    // dedup / relate
    return `<div class="pmems">${pMem(v.primary)}${pMem(v.compare, type === "dedup_merge" ? "gone" : "")}</div>`;
  // single memory (invalidate / stale_review / promotion / scope_widening)
  return `<div class="pmems one">${pMem(v.primary)}</div>` +
    (v.target_topic ? `<span class="ptopic">→ topic: ${esc(v.target_topic)}</span>` : "");
}
function pWait() { return `<div class="t" style="color:var(--dim);margin-top:8px">wacht op meer stemmen (consensus)</div>`; }
function pButtons(c) {
  const v = c.view || {}, p = (v.refs || {}).pollen || c.uid;
  if (v.route === "contradiction") {
    if (c.status !== "ready") return pWait();
    const a = v.refs.a, b = v.refs.b;
    return `<div class="btnrow">
      <button class="action" onclick="resolveContra('${p}','${a}','${b}')">A is huidig → B verouderd</button>
      <button class="action" onclick="resolveContra('${p}','${b}','${a}')">B is huidig → A verouderd</button>
      <button class="ghost" onclick="resolveContraCompat('${p}')">Verenigbaar (geen tegenspraak)</button></div>`;
  }
  if (v.route === "op_route") {
    if (c.status !== "ready") return pWait();
    const merge = v.merge_requested
      ? `<span class="pill role">samenvoegen aangevraagd · wacht op de zwerm</span>`
      : `<button class="ghost" onclick="requestMerge('${p}')">Samenvoegen (zwerm)</button>`;
    return `<div class="btnrow">
      <button class="ghost" onclick="resolveThink('${p}','ADD')">Allebei houden</button>
      <button class="action" onclick="resolveThink('${p}','REPLACE')">Nieuwe vervangt bestaande</button>
      <button class="ghost danger" onclick="resolveThink('${p}','DELETE')">Nieuwe schrappen</button>
      ${merge}
      <button class="ghost" onclick="resolveThink('${p}','NOOP')">Laten staan</button></div>`;
  }
  if (v.route === "human")
    return `<div class="t" style="color:var(--dim);margin-top:8px">Wacht op menselijke review (admin-wachtrij).</div>`;
  // standard
  if (c.status === "ready")
    return `<div class="btnrow"><button class="action" onclick="resolveChore('${c.uid}','apply',false)">Toepassen</button>
      <button class="ghost" onclick="resolveChore('${c.uid}','reject',false)">Afwijzen</button></div>`;
  if (ME.role === "org_admin")
    return `<div class="btnrow"><button class="action" onclick="resolveChore('${c.uid}','apply',true)">Direct toepassen</button>
      <button class="ghost danger" onclick="resolveChore('${c.uid}','reject',true)">Afwijzen</button></div>
      <div class="t" style="color:var(--dim);margin-top:4px">org_admin — bypasst consensus (geaudit)</div>`;
  return pWait();
}

async function exportBackup() {
  const out = document.getElementById("expOut");
  out.textContent = " bezig…";
  try {
    const r = await fetch("/export", { headers: { "Authorization": "Bearer " + TOKEN } });
    if (!r.ok) throw new Error((await r.json().catch(() => ({}))).detail || r.status);
    const blob = await r.blob();
    const cd = r.headers.get("Content-Disposition") || "";
    const name = (cd.match(/filename="([^"]+)"/) || [])[1] || "hivemind-backup.json";
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a"); a.href = url; a.download = name; a.click();
    URL.revokeObjectURL(url);
    out.textContent = ` ✓ ${(blob.size / 1024).toFixed(0)} KB`;
  } catch (e) { out.textContent = ""; alert(e.message); }
}
async function importBackup() {

  out.textContent = " bezig…";
  try {
    const body = await f.text();
    const r = await fetch("/import?mode=" + mode, {
      method: "POST", headers: { "Authorization": "Bearer " + TOKEN, "Content-Type": "application/json" }, body });

async function loadFocus() {

  const cards = foci.map(f => {
    const total = (f.steps || []).length;

    const pct = total ? Math.round(done / total * 100) : 0;
    const enc = encodeURIComponent(f.project || "");
    const steps = (f.steps || []).map((s, i) => {
      const mark = s.status === "done" ? "✓" : (s.status === "current" ? "▶" : "");
      const clickable = s.status !== "done";

        <span class="box">${mark}</span><span class="txt">${esc(s.text)}</span></div>`;
    }).join("");
    const guards = (f.guardrails || []).map(g =>
      `<div class="guard"><span class="ic">🛡️</span><span>${esc(g)}</span></div>`).join("");
    const proj = f.project || "(geen project)";
    return `<div class="block">
      <div class="bh"><span class="ic">🎯</span><h3>${esc(f.goal)}</h3>
        <span class="badge2">${esc(proj)}</span></div>
      <div class="bhint" style="margin-bottom:10px">${f.updated ? "bijgewerkt " + new Date(f.updated).toLocaleString("nl-NL") : "de koers die bij elke prompt wordt her-ingespoten"}</div>
      ${total ? `<div style="display:flex;align-items:center;gap:10px;margin-bottom:2px">
        <div class="prog" style="flex:1"><i style="width:${pct}%"></i></div>
        <span class="t" style="color:var(--dim);font-variant-numeric:tabular-nums">${done}/${total}</span></div>
        <div class="steps">${steps}</div>` : ""}
      ${guards ? `<div class="guards">${guards}</div>` : ""}
      ${f.done_when ? `<div class="bhint" style="margin:8px 0 0"><strong style="color:var(--dim)">Klaar wanneer:</strong> ${esc(f.done_when)}</div>` : ""}
      ${(f.notes && f.notes.length) ? `<div class="bhint" style="margin:6px 0 0"><strong style="color:var(--dim)">Laatste voortgang:</strong> ${esc(f.notes[f.notes.length - 1])}</div>` : ""}
      <div class="btnrow">
        <button class="ghost" onclick="advanceFocus('${enc}')">Notitie / stap</button>
        <button class="ghost" onclick='editFocus(${JSON.stringify(f)})'>Bewerken</button>
        <button class="ghost danger" onclick="clearFocus('${enc}')">Wissen</button>
      </div>
    </div>`;
  }).join("");
  page.innerHTML = `<div class="phdr">
      <div class="htxt"><h2><span class="ic">🎯</span>Actieve focus</h2>
        <div class="sub">De koers die bij élke prompt bovenaan wordt her-ingespoten — per project. Overleeft compaction, voorkomt drift. Klik een stap aan om 'm af te vinken.</div></div>
      <div class="hact"><button class="action" onclick='editFocus(null)'>+ Nieuwe focus</button></div>
    </div>
    ${cards || `<div class="empty"><span class="big">🧭</span>Nog geen actieve focus.<br>Maak er een aan, of laat een agent 'm zetten met <code>focus_set</code>.</div>`}`;
}
async function completeStep(enc, n) {
  try { await api("/focus/advance", { method: "POST", body: JSON.stringify({ project: decodeURIComponent(enc), completed_step: n }) }); loadFocus(); }
  catch (e) { alert(e.message); }
}
function editFocus(f) {
  const isNew = !f;
  f = f || { project: "", goal: "", steps: [], guardrails: [], done_when: "" };
  const stepLines = (f.steps || []).map(s => (s.status === "done" ? "x " : "") + s.text).join("\n");
  const guardLines = (f.guardrails || []).join("\n");
  const page = document.getElementById("focusPage");
  page.innerHTML = `<h2 style="margin-bottom:10px">${isNew ? "Nieuwe focus" : "Focus bewerken"}</h2>
    <div class="card">
      <label class="t">Project (slug)</label>
      <input id="fProject" value="${esc(f.project || "")}" placeholder="korte project-naam (slug)" ${isNew ? "" : "readonly"}>
      <label class="t">Doel</label>
      <input id="fGoal" value="${esc(f.goal || "")}" placeholder="wat bereiken we, in één zin">
      <label class="t">Stappen (één per regel; begin met 'x ' voor afgerond)</label>
      <textarea id="fSteps" rows="5" style="width:100%">${esc(stepLines)}</textarea>
      <label class="t">Guardrails (één per regel; harde wel/niet-regels)</label>
      <textarea id="fGuards" rows="4" style="width:100%">${esc(guardLines)}</textarea>
      <label class="t">Klaar wanneer</label>
      <input id="fDone" value="${esc(f.done_when || "")}" placeholder="definition of done">
      <div style="margin-top:10px">
        <button class="action" onclick="saveFocus()">Opslaan</button>
        <button class="ghost" onclick="loadFocus()">Annuleren</button>
      </div>
    </div>`;
}
async function saveFocus() {
  const parseSteps = t => t.split("\n").map(l => l.trim()).filter(Boolean).map(l =>
    l.toLowerCase().startsWith("x ") ? { text: l.slice(2).trim(), status: "done" } : { text: l, status: "open" });
  const body = {
    project: document.getElementById("fProject").value.trim(),
    goal: document.getElementById("fGoal").value.trim(),
    steps: parseSteps(document.getElementById("fSteps").value),
    guardrails: document.getElementById("fGuards").value.split("\n").map(l => l.trim()).filter(Boolean),
    done_when: document.getElementById("fDone").value.trim(),
  };
  if (!body.goal) { alert("Doel is verplicht"); return; }
  try { await api("/focus", { method: "POST", body: JSON.stringify(body) }); loadFocus(); }
  catch (e) { alert(e.message); }
}
async function advanceFocus(enc) {
  const n = prompt("Welk stapnummer is klaar? (leeg = alleen een notitie)");
  if (n === null) return;
  const note = prompt("Voortgangsnotitie (optioneel):") || null;
  const body = { project: decodeURIComponent(enc), note };
  if (n.trim()) body.completed_step = parseInt(n.trim(), 10);
  try { await api("/focus/advance", { method: "POST", body: JSON.stringify(body) }); loadFocus(); }
  catch (e) { alert(e.message); }
}
async function clearFocus(enc) {
  if (!confirm("Deze focus wissen?")) return;
  try { await api("/focus?project=" + enc, { method: "DELETE" }); loadFocus(); }
  catch (e) { alert(e.message); }
}

/* ---------- boot ---------- */
function boot() {
  document.getElementById("who").textContent = ME.name + " · " + ME.role;
  document.getElementById("choreBadge").innerHTML = ME.ready_chores ? `<span class="badge">${ME.ready_chores}</span>` : "";
  document.getElementById("choreDotM").style.display = ME.ready_chores ? "block" : "none";
  if (ME.can_review) { document.getElementById("reviewTab").style.display = ""; document.getElementById("reviewTabM").style.display = ""; }
  document.getElementById("histBtn").style.display = ME.role === "org_admin" ? "" : "none";
  applySciFi();
  // On phones the side panels are slide-in overlays; start with the left one closed so the
  // graph is visible. The edge tabs (‹ ›) open/close them.
  if (window.innerWidth <= 820) {
    document.getElementById("left").classList.add("collapsed");
    const t = document.getElementById("leftTab"); if (t) t.textContent = "›";
  }
  document.getElementById("legend").innerHTML = Object.entries(COLORS).map(([t, c]) =>
    `<span><span class="dot" style="background:${c}"></span>${t}</span>`).join("")
    + `<span style="opacity:.6">· dubbelklik knoop: uit-/inklappen</span>`;
  renderTypeFilter();
  // The graph island: React Flow + d3-force (see graph-ui/). The bridge gives it the API
  // + callbacks into this page; everything else here talks to it via window.NectarGraph.
  NectarGraph.mount(document.getElementById("graphRoot"), {
    api,
    colors: COLORS, hiveColor: HIVE_COLOR, attColor: ATT_COLOR,
    hiveUid: HIVE_UID, hiveTitle: "Nectar",
    onShowNode: renderNodePanel,
    onAttachmentOpen: showAttachment,
    onSelectionCleared: () => { document.getElementById("right").style.display = "none"; },
  });
  NectarGraph.setSciFi(sciFi);
  NectarGraph.setTypeFilter([...activeTypes]);
  loadTopics();
}

async function doWizard() {
  const name = document.getElementById("wname").value.trim();
  const email = document.getElementById("wemail").value.trim();
  const pass = document.getElementById("wpass").value;
  if (name.length < 2) { document.getElementById("loginErr").textContent = "Naam te kort"; return; }
  try {
    const reg = await (await fetch("/register", { method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ name, email: email || null }) })).json();
    if (!reg.token) throw new Error(reg.detail || "mislukt");
    TOKEN = reg.token;
    if (pass) {
      await fetch("/auth/password", { method: "POST", headers: {
        "Authorization": "Bearer " + TOKEN, "Content-Type": "application/json" },
        body: JSON.stringify({ password: pass }) });
    }
    ME = await api("/graph/me");
    localStorage.setItem("hive_token", TOKEN);
    document.getElementById("overlay").style.display = "none";
    boot();
  } catch (e) { document.getElementById("loginErr").textContent = e.message; }
}

async function downloadInstallZip() {
  try {
    const r = await fetch("/install.zip", { headers: { "Authorization": "Bearer " + TOKEN } });
    if (!r.ok) throw new Error("download mislukt");
    const url = URL.createObjectURL(await r.blob());
    const a = document.createElement("a"); a.href = url; a.download = "hivemind-install.zip";
    a.click(); URL.revokeObjectURL(url);
  } catch (e) { alert(e.message); }
}

(async () => {
  // Token handed back by the Microsoft (Entra) callback via the URL fragment.
  const hash = new URLSearchParams(location.hash.slice(1));
  if (hash.get("token")) { TOKEN = hash.get("token"); localStorage.setItem("hive_token", TOKEN); history.replaceState(null, "", location.pathname); }
  if (hash.get("error")) { document.getElementById("loginErr").textContent = decodeURIComponent(hash.get("error")); }

  if (TOKEN) {
    try { ME = await api("/graph/me"); document.getElementById("overlay").style.display = "none"; boot(); return; }
    catch (e) { TOKEN = ""; localStorage.removeItem("hive_token"); }
  }

  document.getElementById("overlay").style.display = "flex";
  // First run? Show the wizard instead of login.
  try {
    const st = await (await fetch("/register")).json();
    if (st.first_run) {
      document.getElementById("wizard").style.display = "";
      document.getElementById("loginBox").style.display = "none";
      return;
    }
  } catch (e) { /* ignore */ }
  loginTab("pw");
  try {
    const e = await (await fetch("/auth/entra/status")).json();
    if (e.enabled) document.getElementById("entraBtn").style.display = "";
  } catch (e) { /* ignore */ }
})();
</script>
</body>
