services:
  hivemind:
    # Voorgebakken image van GHCR (docker compose pull) — gepubliceerd door
    # .github/workflows/docker-release.yml op elke v*-tag. Lokale build
    # blijft de dev-route: docker compose up -d --build.
    image: ${NECTAR_IMAGE:-ghcr.io/nickozz714/nectar:latest}
    build: .
    init: true
    env_file: .env
    ports:
      - "8642:8000"   # API + MCP
      - "7474:7474"   # Neo4j Browser — a window into the mind
      - "7687:7687"
    volumes:
      - hive-data:/data
    # Een plafond, zodat dit proces de machine niet kan leegtrekken.
    #
    # Aanleiding: op 14-09-2026 stond deze container op 10,4 GB van de 23 GB van
    # de thuisserver. De oorzaak is inmiddels weg (de ONNX-arena, zie
    # ONNX_MEM_ARENA in server/src/components/config.py), maar het plafond blijft
    # staan — want het probleem was niet dat er een lek was, het was dat NIEMAND
    # het merkte tot de hele server ging swappen en alles erop vastliep.
    #
    # Met een limiet valt deze container om in plaats van zijn buren mee te
    # slepen. Dat is vervelender voor HiveMind en veel beter voor de rest; een
    # herstart is goedkoop, een server die staat te thrashen niet. Drie GB is
    # ruim: na een verse start zit hij op ~140 MB, met beide modellen geladen op
    # ~750 MB.
    mem_limit: 3g
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8000/health > /dev/null 2>&1 || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 60
      start_period: 30s

  # HTTPS sidecar so the MCP client (Bun) can connect over TLS (plain HTTP to a LAN IP
  # fails at the socket level). API stays on :8642 for the curl-based recall hook.
  caddy:
    image: caddy:2
    depends_on:
      hivemind:
        condition: service_healthy
    environment:
      # De Caddyfile leest deze BINNEN de container ({$NECTAR_HOST}), dus hij moet
      # hier expliciet mee: zonder deze regel is de variabele daar leeg, wordt
      # `default_sni` een directive zonder argument, weigert Caddy de hele config
      # en herstart hij eindeloos. De default houdt een verse clone werkend; voor
      # toegang vanaf een ander apparaat zet je NECTAR_HOST in .env op de
      # hostnaam of het IP van de server (daarop wordt ook het certificaat
      # uitgegeven).
      NECTAR_HOST: ${NECTAR_HOST:-localhost}
    ports:
      - "8643:8643"   # HTTPS: API + MCP over TLS
    volumes:
      - ./deploy/https/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
    restart: unless-stopped

volumes:
  hive-data:
  caddy-data:
