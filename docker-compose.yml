services:
  hivemind:
    build: .
    init: true
    env_file: .env
    ports:
      - "8642:8000"   # API + MCP
      - "7474:7474"   # Neo4j Browser — a window into the mind
      - "7687:7687"
    volumes:
      - hive-data:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8000/health > /dev/null 2>&1 || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 60
      start_period: 30s

volumes:
  hive-data:
