services:
  neo4j:
    image: neo4j:5-community
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:-change-me-neo4j}
    ports:
      - "7474:7474"   # Neo4j Browser — a window into the mind
      - "7687:7687"
    volumes:
      - hive-neo4j-data:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:7474 > /dev/null 2>&1 || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 30

  api:
    build: ./server
    env_file: .env
    environment:
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:-change-me-neo4j}
    ports:
      - "8642:8000"
    depends_on:
      neo4j:
        condition: service_healthy

volumes:
  hive-neo4j-data:
