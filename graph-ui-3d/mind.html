<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NECTAR // MIND — MIX</title>
<style>
  :root {
    --bg: #020409;
    --amber: #ffb547;
    --amber-dim: #8a6220;
    --cyan: #3ee0ff;
    --cyan-dim: rgba(62, 224, 255, .28);
    --ink: #d9e6f2;
    --dim: #5d7286;
    --panel: rgba(6, 12, 20, .82);
    --line: rgba(62, 224, 255, .22);
    --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: var(--bg); }
  body { font-family: var(--mono); color: var(--ink); }
  #graph { position: fixed; inset: 0; }
  #graph canvas { outline: none; }

  /* scanline / vignette overlay */
  .fx {
    position: fixed; inset: 0; pointer-events: none; z-index: 5;
    background:
      repeating-linear-gradient(0deg, rgba(255,255,255,.028) 0 1px, transparent 1px 3px),
      radial-gradient(ellipse at center, transparent 55%, rgba(0,0,0,.55) 100%);
  }

  /* travel veil: short fade between galaxy and a star system */
  #veil { position: fixed; inset: 0; z-index: 15; pointer-events: none;
          background: var(--bg); opacity: 0; transition: opacity .32s ease; }
  #veil.on { opacity: 1; }

  /* corner brackets */
  .corner { position: fixed; width: 26px; height: 26px; z-index: 6; pointer-events: none; opacity: .8; }
  .corner.tl { top: 10px; left: 10px; border-top: 1.5px solid var(--cyan); border-left: 1.5px solid var(--cyan); }
  .corner.tr { top: 10px; right: 10px; border-top: 1.5px solid var(--cyan); border-right: 1.5px solid var(--cyan); }
  .corner.bl { bottom: 10px; left: 10px; border-bottom: 1.5px solid var(--cyan); border-left: 1.5px solid var(--cyan); }
  .corner.br { bottom: 10px; right: 10px; border-bottom: 1.5px solid var(--cyan); border-right: 1.5px solid var(--cyan); }

  .hud { position: fixed; z-index: 10; }

  /* top-left: brand + stats + breadcrumb */
  #brand { top: 22px; left: 26px; user-select: none; max-width: 44vw; }
  #brand h1 { margin: 0; font-size: 15px; letter-spacing: .34em; font-weight: 700; color: var(--amber); }
  #brand h1 span { color: var(--cyan); }
  #brand .sub { font-size: 10px; letter-spacing: .18em; color: var(--dim); margin-top: 4px; text-transform: uppercase; }
  #stats { margin-top: 12px; font-size: 10.5px; letter-spacing: .08em; color: var(--dim); line-height: 1.9; }
  #stats b { color: var(--ink); font-weight: 600; }
  #stats .ok { color: #55ffa1; }
  #crumb { margin-top: 10px; display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  #crumbPath { font-size: 11px; letter-spacing: .22em; text-transform: uppercase; color: var(--amber); }
  #crumbPath .sep { color: var(--dim); margin: 0 4px; }
  #crumbPath .here { color: var(--ink); letter-spacing: .1em; }
  #btnBack { display: none; }

  /* top-right: search */
  #searchBox { top: 22px; right: 26px; width: min(320px, 42vw); }
  #search {
    width: 100%; background: var(--panel); color: var(--ink);
    border: 1px solid var(--line); border-radius: 4px;
    font: 12px var(--mono); letter-spacing: .06em; padding: 9px 12px; outline: none;
  }
  #search:focus { border-color: var(--cyan); box-shadow: 0 0 14px rgba(62,224,255,.18); }
  #search::placeholder { color: var(--dim); }
  #results { margin-top: 6px; background: var(--panel); border: 1px solid var(--line); border-radius: 4px;
             backdrop-filter: blur(8px); max-height: 46vh; overflow-y: auto; display: none; }
  #results div { padding: 8px 12px; font-size: 11.5px; cursor: pointer; display: flex; gap: 8px; align-items: center; }
  #results div:hover { background: rgba(62,224,255,.08); }
  #results .topicTag { color: var(--dim); font-size: 9.5px; margin-left: auto; letter-spacing: .08em; }
  .dot { width: 7px; height: 7px; border-radius: 50%; flex: none; }

  .chip {
    display: inline-flex; align-items: center; gap: 7px;
    background: var(--panel); border: 1px solid var(--line); border-radius: 3px;
    padding: 5px 10px; font-size: 10px; letter-spacing: .12em; text-transform: uppercase;
    cursor: pointer; user-select: none; color: var(--ink); text-decoration: none;
  }
  .chip:hover { border-color: var(--cyan); color: var(--cyan); }

  /* bottom-right: hints */
  #hints { bottom: 24px; right: 26px; text-align: right; font-size: 10px; letter-spacing: .1em;
           color: var(--dim); line-height: 1.9; text-transform: uppercase; }
  #hints .key { color: var(--cyan); }

  /* right: detail panel */
  #panel {
    top: 90px; right: 26px; width: min(360px, 46vw); max-height: calc(100vh - 210px);
    background: var(--panel); border: 1px solid var(--line); border-radius: 6px;
    backdrop-filter: blur(10px); display: none; flex-direction: column; overflow: hidden;
    box-shadow: 0 0 34px rgba(62,224,255,.09); z-index: 11;
  }
  #panel.open { display: flex; }
  #panel .phead { padding: 14px 16px 10px; border-bottom: 1px solid var(--line); }
  #panel .ptitle { font-size: 13.5px; font-weight: 600; line-height: 1.45; letter-spacing: .02em; }
  #panel .pchips { margin-top: 8px; display: flex; flex-wrap: wrap; gap: 5px; }
  .pchip { font-size: 9.5px; letter-spacing: .14em; text-transform: uppercase; border: 1px solid var(--line);
           border-radius: 3px; padding: 2px 7px; color: var(--cyan); }
  .pchip.amber { color: var(--amber); border-color: rgba(255,181,71,.35); }
  #panel .pbody { padding: 12px 16px; overflow-y: auto; font-size: 12px; line-height: 1.7;
                  color: var(--ink); white-space: pre-wrap; }
  #panel .pfoot { padding: 10px 16px; border-top: 1px solid var(--line); display: flex; gap: 8px; }
  .btn { flex: 1; text-align: center; border: 1px solid var(--line); border-radius: 3px; padding: 7px 0;
         font-size: 10px; letter-spacing: .18em; text-transform: uppercase; cursor: pointer; color: var(--cyan); }
  .btn:hover { background: rgba(62,224,255,.08); }

  /* loading splash */
  #splash { position: fixed; inset: 0; z-index: 20; display: flex; flex-direction: column;
            align-items: center; justify-content: center; gap: 18px; background: var(--bg); }
  #splash .ring { width: 54px; height: 54px; border-radius: 50%; border: 2px solid transparent;
                  border-top-color: var(--amber); border-right-color: var(--cyan);
                  animation: spin 1.1s linear infinite; }
  #splash .t { font-size: 11px; letter-spacing: .3em; color: var(--dim); text-transform: uppercase; }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* cockpit drilldown overlay */
  #drill { position: fixed; inset: 0; z-index: 18; background: rgba(2,4,9,.55);
           opacity: 0; pointer-events: none; transition: opacity .28s ease; }
  #drill.on { opacity: 1; pointer-events: auto; }
  #drill iframe { position: absolute; inset: 3vh 3vw; width: 94vw; height: 94vh;
                  border: 1px solid var(--line); border-radius: 8px; background: var(--bg);
                  box-shadow: 0 0 60px rgba(62,224,255,.12); }

  .scene-tooltip { font: 11px var(--mono) !important; color: var(--ink) !important;
                   background: var(--panel); border: 1px solid var(--line); border-radius: 3px;
                   padding: 5px 9px !important; letter-spacing: .04em; }
</style>
</head>
<body>
<div id="graph"></div>
<div class="fx"></div>
<div id="veil"></div>
<div class="corner tl"></div><div class="corner tr"></div>
<div class="corner bl"></div><div class="corner br"></div>

<div class="hud" id="brand">
  <h1>NECTAR <span>//</span> MIND</h1>
  <div class="sub">swarm hud · mix</div>
  <div id="stats"></div>
  <div id="crumb">
    <span id="crumbPath">GALAXY</span>
    <span class="chip" id="btnBack">◂ terug naar overzicht</span>
    <span class="chip" id="btnMode">⊚ modus: netwerk</span>
  </div>
</div>

<div class="hud" id="searchBox">
  <input id="search" type="text" placeholder="▸ zoek in de mind…" autocomplete="off" spellcheck="false">
  <div id="results"></div>
</div>

<div class="hud" id="panel">
  <div class="phead">
    <div class="ptitle" id="pTitle"></div>
    <div class="pchips" id="pChips"></div>
  </div>
  <div class="pbody" id="pBody"></div>
  <div class="pfoot">
    <div class="btn" id="btnDrill" style="color:var(--amber);border-color:rgba(255,181,71,.4)">⌕ drilldown</div>
    <div class="btn" id="btnClose">sluit</div>
  </div>
</div>

<div class="hud" id="variants" style="bottom:64px;right:26px;display:flex;gap:6px">
  <a class="chip" href="./index.html">netwerk</a>
  <a class="chip" href="./cockpit.html">cockpit</a>
  <a class="chip" href="./galaxy.html">galaxy</a>
  <a class="chip" style="color:var(--amber);border-color:rgba(255,181,71,.4)" href="./mind.html">mix</a>
</div>

<div class="hud" id="hints">
  <div><span class="key">klik ster</span> stelsel in · <span class="key">rechtsklik</span> drilldown · <span class="key">esc</span> terug</div>
  <div><span class="key">sleep</span> draai · <span class="key">scroll</span> zoom · <span class="key">/</span> zoekt</div>
</div>

<div id="drill"><iframe id="drillFrame" title="drilldown"></iframe></div>

<div id="splash"><div class="ring"></div><div class="t">mind wordt geladen…</div></div>

<script>
  // never hang silently on the splash — surface any startup error on the page
  const showErr = m => { const s = document.getElementById("splash");
    if (s) s.innerHTML = `<div class="t" style="color:#ff7847;max-width:70vw;letter-spacing:.05em">fout: ${m}</div>`; };
  window.addEventListener("error", e => showErr(e.message || e.type));
  window.addEventListener("unhandledrejection", e => showErr(e.reason?.message || String(e.reason)));
</script>
<!-- mind.bundle.js = mind.src.js + deps; rebuild after editing:
     npx esbuild mind.src.js --bundle --format=esm --target=es2022 --outfile=mind.bundle.js -->
<script type="module" src="./mind.bundle.js"></script>
</body>
</html>
