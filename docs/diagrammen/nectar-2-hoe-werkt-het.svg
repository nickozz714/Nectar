<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="n2">
  <title id="n2">Hoe Nectar werkt: ophalen, werken, terugschrijven, onderhouden</title>
  <defs>
    <marker id="ah" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M1 1 L11 6 L1 11 z" fill="#E08C1E"/>
    </marker>
    <marker id="ag" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M1 1 L11 6 L1 11 z" fill="#94A3B8"/>
    </marker>
  </defs>
  <style>
    .f { font-family: Archivo, "Segoe UI", "Helvetica Neue", Arial, sans-serif; }
    .title { font-size: 38px; font-weight: 700; fill: #0B1220; }
    .sub { font-size: 18px; fill: #64748B; }
    .eyebrow { font-size: 14px; font-weight: 700; fill: #C9761A; letter-spacing: 2.4px; }
    .h { font-size: 19px; font-weight: 700; fill: #0B1220; }
    .lab { font-size: 14.5px; fill: #334155; }
    .sm { font-size: 13.5px; fill: #64748B; }
    .num { font-size: 15px; font-weight: 700; fill: #0B1220; }
    .tag { font-size: 12.5px; font-weight: 700; letter-spacing: 1.1px; }
  </style>

  <rect width="1600" height="900" fill="#FBFCFE"/>
  <rect x="0" y="0" width="1600" height="6" fill="#E08C1E"/>

  <text class="f eyebrow" x="70" y="76">NECTAR · PLAAT 2 — HOE HET WERKT</text>
  <text class="f title" x="70" y="120">Ophalen, werken, terugschrijven — en het onderhoudt zichzelf</text>
  <text class="f sub" x="70" y="153">Niemand hoeft te beslissen wánneer hij het geheugen raadpleegt. Dat gebeurt vanzelf, elke keer.</text>

  <!-- 1 -->
  <rect x="70" y="212" width="342" height="240" rx="14" fill="#FDF3E3" stroke="#E08C1E" stroke-width="2.5"/>
  <circle cx="102" cy="246" r="17" fill="#E08C1E"/>
  <text class="f num" x="102" y="252" text-anchor="middle">1</text>
  <text class="f h" x="132" y="252">Het komt vanzelf</text>
  <text class="f lab" x="98" y="292">Bij elke vraag die je stelt, kijkt</text>
  <text class="f lab" x="98" y="316">Nectar eerst wat er over dit</text>
  <text class="f lab" x="98" y="340">onderwerp al bekend is en zet</text>
  <text class="f lab" x="98" y="364">dat erbij.</text>
  <text class="f sm" x="98" y="396">Je hoeft er niet om te vragen, en de</text>
  <text class="f sm" x="98" y="418">agent hoeft niet te bedenken dát hij</text>
  <text class="f sm" x="98" y="440">iets zou moeten opzoeken.</text>

  <path d="M412 332 L446 332" stroke="#E08C1E" stroke-width="3" marker-end="url(#ah)"/>

  <!-- 2 -->
  <rect x="452" y="212" width="342" height="240" rx="14" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="2"/>
  <circle cx="484" cy="246" r="17" fill="#E08C1E"/>
  <text class="f num" x="484" y="252" text-anchor="middle">2</text>
  <text class="f h" x="514" y="252">Het werk gebeurt</text>
  <text class="f lab" x="480" y="292">Met die kennis al in beeld. Geen</text>
  <text class="f lab" x="480" y="316">"weet je nog dat we vorige maand</text>
  <text class="f lab" x="480" y="340">besloten hebben…" — dat staat er</text>
  <text class="f lab" x="480" y="364">gewoon bij.</text>
  <text class="f sm" x="480" y="396">Achteraf geef je aan wat écht hielp.</text>
  <text class="f sm" x="480" y="418">Daar leert de rangschikking van: wat</text>
  <text class="f sm" x="480" y="440">bruikbaar bleek, komt vaker boven.</text>

  <path d="M794 332 L828 332" stroke="#E08C1E" stroke-width="3" marker-end="url(#ah)"/>

  <!-- 3 -->
  <rect x="834" y="212" width="342" height="240" rx="14" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="2"/>
  <circle cx="866" cy="246" r="17" fill="#E08C1E"/>
  <text class="f num" x="866" y="252" text-anchor="middle">3</text>
  <text class="f h" x="896" y="252">Terug, langs een poort</text>
  <text class="f lab" x="862" y="292">Wat je leerde gaat terug het</text>
  <text class="f lab" x="862" y="316">geheugen in — maar niet zomaar.</text>
  <rect x="862" y="330" width="286" height="102" rx="10" fill="#F1F5F9"/>
  <text class="f sm" x="880" y="356">Is het bruikbaar voor een ander?</text>
  <text class="f sm" x="880" y="380">Staan er persoonsgegevens in?</text>
  <text class="f sm" x="880" y="404">Staat het er al, net anders verwoord?</text>
  <text class="f" x="880" y="424" font-size="12.5" font-weight="700" fill="#B45309">Zo ja, dan komt het er niet zo in.</text>

  <path d="M1176 332 L1210 332" stroke="#E08C1E" stroke-width="3" marker-end="url(#ah)"/>

  <!-- 4 -->
  <rect x="1216" y="212" width="314" height="240" rx="14" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="2"/>
  <circle cx="1248" cy="246" r="17" fill="#E08C1E"/>
  <text class="f num" x="1248" y="252" text-anchor="middle">4</text>
  <text class="f h" x="1278" y="252">Het ruimt zichzelf op</text>
  <text class="f lab" x="1244" y="292">Nectar merkt zelf dubbelingen,</text>
  <text class="f lab" x="1244" y="316">losse eindjes en dingen die</text>
  <text class="f lab" x="1244" y="340">elkaar tegenspreken op.</text>
  <text class="f sm" x="1244" y="372">Daar maakt hij kleine klusjes van, die</text>
  <text class="f sm" x="1244" y="394">de volgende agent die toch langskomt</text>
  <text class="f sm" x="1244" y="416">even oppakt. Geen bibliothecaris</text>
  <text class="f sm" x="1244" y="438">nodig.</text>

  <!-- lus -->
  <path d="M1373 452 L1373 512 Q1373 530 1355 530 L259 530 Q241 530 241 512 L241 452"
        fill="none" stroke="#94A3B8" stroke-width="2.5" stroke-dasharray="8 6" marker-end="url(#ag)"/>
  <rect x="640" y="508" width="336" height="44" rx="10" fill="#FBFCFE"/>
  <text class="f lab" x="808" y="537" text-anchor="middle" fill="#64748B">…en het geheugen is weer een beetje beter</text>

  <!-- onderste band -->
  <rect x="70" y="596" width="470" height="234" rx="16" fill="#0B1220"/>
  <text class="f tag" x="98" y="632" fill="#E08C1E">HOE HET ZOEKT</text>
  <text class="f" x="98" y="666" font-size="18" font-weight="700" fill="#FFFFFF">Op betekenis, niet op</text>
  <text class="f" x="98" y="690" font-size="18" font-weight="700" fill="#FFFFFF">exacte woorden</text>
  <text class="f" x="98" y="724" font-size="14" fill="#94A3B8">Vraag je naar "hoe loggen we in bij</text>
  <text class="f" x="98" y="746" font-size="14" fill="#94A3B8">Fabric", dan vindt hij ook de notitie</text>
  <text class="f" x="98" y="768" font-size="14" fill="#94A3B8">die "authenticatie op het dataplatform"</text>
  <text class="f" x="98" y="790" font-size="14" fill="#94A3B8">heet. De modelletjes die dat doen zijn</text>
  <text class="f" x="98" y="812" font-size="14" fill="#94A3B8">klein en draaien op je eigen server mee.</text>

  <rect x="564" y="596" width="470" height="234" rx="16" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="2"/>
  <text class="f tag" x="592" y="632" fill="#94A3B8">WAT BOVENKOMT</text>
  <text class="f h" x="592" y="666">Wat gebruikt wordt stijgt,</text>
  <text class="f h" x="592" y="690">wat niemand raakt zakt weg</text>
  <text class="f sm" x="592" y="724">Kennis veroudert, en een geheugen dat dat</text>
  <text class="f sm" x="592" y="746">niet meeneemt wordt een zolder. Hier zakt</text>
  <text class="f sm" x="592" y="768">wat niemand meer nodig heeft vanzelf naar</text>
  <text class="f sm" x="592" y="790">beneden — het is niet weg, het staat alleen</text>
  <text class="f sm" x="592" y="812">niet meer vooraan.</text>

  <rect x="1058" y="596" width="472" height="234" rx="16" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="2"/>
  <text class="f tag" x="1086" y="632" fill="#94A3B8">WIE WAT MAG</text>
  <text class="f h" x="1086" y="666">Iedereen een eigen sleutel</text>
  <text class="f sm" x="1086" y="700">Drie rollen: meelezen en bijdragen,</text>
  <text class="f sm" x="1086" y="722">onderhouden, of beheren. Aan de sleutel</text>
  <text class="f sm" x="1086" y="744">hangt de rol, en die kun je intrekken.</text>
  <text class="f sm" x="1086" y="774">Een wijziging in bestaande kennis vraagt</text>
  <text class="f sm" x="1086" y="796">bevestiging van een tweede — zodat één</text>
  <text class="f sm" x="1086" y="818">agent niet in zijn eentje geschiedenis herschrijft.</text>
</svg>
